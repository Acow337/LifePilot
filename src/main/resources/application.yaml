server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: hmdp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略空字段

mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包

logging:
  level:
    com.hmdp: ${APP_LOG_LEVEL:debug}

hmdp:
  upload-dir: ${HMDP_UPLOAD_DIR:./nginx-1.18.0/html/hmdp/imgs}
